# Every search file has this shape. Nothing here is specific to a product type:
# the generic fields are the same for a bike, a laptop or a car, and everything
# you want to say about *this* product goes into `scoring.rules` as text patterns.
name: gravel
source: olx

# Optional. A domain pack adds structured extraction and richer report columns.
# Delete this line and the search still works - it just scores on price,
# location, condition and the rules below.
domain: bikes

search:
  category_id: 4242              # see `deal categories` for the ids
  queries: ['', 'gravel']
  price: { from: 1200, to: 6500 }
  max_pages: 5
  sort_by: created_at:desc
  area:
    name: Warszawa
    city_id: 17871
    lat: 52.2297
    lon: 21.0122
    radius_km: 100

# Budget is a multiplier on the whole score, not one criterion among many, so a
# pricey item has to be clearly better to beat a well-priced one.
budget:
  target: 4000
  comfortable_max: 4500
  soft_max: 5000
  hard_max: 6500
  expensive_floor: 0.68

scoring:
  weights:
    location: 10
    condition: 12

  # Text rules: patterns are regexes, matched against title, description and the
  # marketplace's own fields. Negation is handled, so "bez pekniec" does not fire
  # a damage rule. `scope: title` narrows a rule to the title.
  rules:
    - name: parts only
      any: ['na\s*cz[eę][sś]ci', 'sama\s*rama', 'tylko\s*rama']
      reject: true
    - name: frame damage
      any: ['p[eę]kni[eę]t\w*\s*ram\w*', 'z[lł]amana\s*rama']
      reject: true
    - name: electric
      any: ['elektryczn\w*', '\be-?bike\b', 'wspomagani\w*']
      reject: true
    - name: flat bar conversion
      any: ['flat\s*bar', 'flatbar', 'prosta\s*kierownic\w*']
      reject: true
    - name: fitness hybrid
      any: ['\bfitness\b']
      scope: title
      reject: true
    - name: wanted ad, not for sale
      any: ['\bkupi[eę]\b', '\bposzukuj[eę]\b', '\bszukam\b', '\bzamieni[eę]\b']
      reject: true

# The minimum a search file needs. Same shape, fewer rules.
name: mtb
source: olx
domain: bikes

search:
  category_id: 1651
  queries: ['', 'hardtail']
  price: { from: 800, to: 4000 }
  max_pages: 3
  sort_by: created_at:desc
  area:
    name: Warszawa
    city_id: 17871
    lat: 52.2297
    lon: 21.0122
    radius_km: 100

budget:
  target: 2000
  comfortable_max: 2500
  soft_max: 3000
  hard_max: 4000
  expensive_floor: 0.68

scoring:
  weights:
    location: 10
    condition: 12

  rules:
    - name: air suspension
      any: ['amortyzator\w*\s*powietrzn\w*', '\bair\b.*\bfork\b', '\brockshox\b', '\bfox\b']
      points: 8
    - name: parts only
      any: ['na\s*cz[eę][sś]ci', 'sama\s*rama']
      reject: true
    - name: electric
      any: ['elektryczn\w*', '\be-?bike\b']
      reject: true
    - name: kids bike
      any: ['dzieci[eę]c\w*', 'ko[lł]a\s*(12|14|16|18|20)\b']
      reject: true

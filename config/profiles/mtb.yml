# A second search, defined entirely in YAML - no Python was written for it.
# It reuses the `bikes` domain pack; only the preferences differ.
name: mtb
domain: bikes
description: Example hardtail MTB search - shows that a new search is configuration only

search:
  olx:
    category_id: 1651        # OLX "Rowery gorskie"
    queries: ["", "hardtail"]
    price_from: 800
    price_to: 4000
    max_pages: 3
    sort_by: created_at:desc
    area:
      name: Warszawa
      city_id: 17871
      lat: 52.2297
      lon: 21.0122
      radius_km: 100

preferences:
  rider:
    height_cm: 178
    inseam_cm: 82

  budget:
    target: 2000
    comfortable_max: 2500
    soft_max: 3000
    hard_max: 4000
    expensive_floor: 0.68

  location:
    proximity_to: search_area
    preferred_radius_km: 100

  frame_size:
    # MTB frames are sold in inches; the domain converts them, so the same
    # centimetre ranges keep working.
    ideal_reach_mm: [430, 460]
    acceptable_reach_mm: [415, 475]
    comfort_stack_mm: 600
    reject_reach_below: 380
    reject_reach_above: 500
    preferred_cm: [46, 48, 50]
    acceptable_cm: [43, 44, 45, 51, 52]
    preferred_letter: ["L", "M/L"]
    acceptable_letter: ["M", "XL"]
    reject_cm_below: 38
    reject_cm_above: 58
    reject_letters: ["XS", "XXL"]

  brands:
    preferred: [cube, giant, trek, merida, specialized, kross, ghost, scott, kellys, canyon]
    avoid: []

  preferred_groupsets: [deore, slx, xt]
  preferred_models: []

  required: []
  nice_to_have: [hydraulic_disc, through_axle, "1x_drivetrain"]
  disqualifying: [parts_only, frame_damage, kids_bike, ebike, wrong_category]

weights:
  size: 28
  groupset: 24
  features: 18
  condition: 12
  location: 10
  brand: 8

bonuses:
  preferred_model: 4
  fresh_listing: 2

# Same shape as every other search file. Compare it with gravel.yml: the generic
# fields are identical, only the rules differ - that is the whole point.
name: laptop
source: olx
domain: laptops

search:
  category_id: 1199
  queries: ['', 'thinkpad']
  price: { from: 800, to: 4500 }
  max_pages: 3
  sort_by: created_at:desc
  area:
    name: Warszawa
    city_id: 17871
    lat: 52.2297
    lon: 21.0122
    radius_km: 100

budget:
  target: 2500
  comfortable_max: 3000
  soft_max: 3600
  hard_max: 4500
  expensive_floor: 0.68

scoring:
  weights:
    location: 8
    condition: 10

  rules:
    - name: warranty
      any: ['gwarancj\w*']
      points: 3
    - name: worn battery
      any: ['bateria\s*do\s*wymiany', 'zu[zż]yt\w*\s*bateri\w*', 's[lł]ab\w*\s*bateri\w*']
      points: -8
    - name: overheating
      any: ['przegrzewa', 'g[lł]o[sś]n\w*\s*wentylator']
      points: -8
    - name: liquid damage
      any: ['zalan\w*']
      reject: true
    - name: not working
      any: ['nie\s*dzia[lł]a', 'nie\s*w[lł][aą]cza', 'do\s*naprawy', 'na\s*cz[eę][sś]ci']
      reject: true
    - name: locked device
      any: ['blokada\s*(bios|icloud|mdm)', 'has[lł]o\s*bios', 'icloud\s*lock']
      reject: true
    - name: broken screen
      any: ['zbit\w*\s*ekran\w*', 'p[eę]kni[eę]t\w*\s*(matryc|ekran)\w*', 'bez\s*matryc\w*']
      reject: true
    - name: wanted ad, not for sale
      any: ['\bkupi[eę]\b', '\bposzukuj[eę]\b', '\bszukam\b']
      reject: true

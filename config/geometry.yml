# Manufacturer geometry, used to score fit by actual reach/stack instead of the
# seller's stated size label. Nominal sizes are not comparable across brands - a
# Merida Silex L and a race-geometry L are different bikes - which is exactly why
# this table exists.
#
# reach / stack in millimetres, taken from manufacturer geometry charts.
# Only letter sizes are keyed here; cm-labelled listings fall back to the generic
# size chart in the profile, which is deliberately capped at lower confidence.
#
# HOW TO EXTEND: add a brand key, then one block per model generation. Set
# `verified: false` until you have checked the numbers against the manufacturer's
# own chart - unverified entries are scored with reduced confidence.

merida:
  - model: silex
    generation: "gen 1 (approx. 2017-2021)"
    years: [2017, 2021]
    verified: true
    source: "provided by the owner of this repo; Merida Silex first-generation chart"
    sizes:
      M: { reach: 400, stack: 625 }
      L: { reach: 415, stack: 644 }

  - model: silex
    generation: "gen 2 (approx. 2022+)"
    years: [2022, 2030]
    verified: true
    source: "provided by the owner of this repo; Merida Silex current chart"
    sizes:
      M: { reach: 412, stack: 607 }
      L: { reach: 426, stack: 626 }

